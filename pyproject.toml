[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-terminal"
version = "0.5.0"
description = "SSH and serial desktop terminal with strict host verification"
requires-python = ">=3.11"
dependencies = ["asyncssh[bcrypt]>=2.21,<3", "pyserial>=3.5,<4", "pyte>=0.8.2,<0.9", "PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
harbor-terminal = "harbor_terminal.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["harbor_terminal*"]
